[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-hdp"
version = "0.3.0"
description = "Capture and optionally solve unfinished HDP assignments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-codex>=0.155,<1",
  "playwright>=1.55,<2",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
auto-hdp = "auto_hdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
